<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szyfrowanie zdjęć – narzędzie lokalne</title>
<style>
body{font-family:Georgia,serif;background:#faf7f0;color:#6b5320;max-width:640px;margin:30px auto;padding:0 18px;line-height:1.5}
h1{font-weight:400;font-size:28px;color:#a47c2a}
.card{background:#fff;border:1px solid #e6d8b0;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 6px 20px rgba(120,100,60,.08)}
label{display:block;margin:10px 0 4px;font-size:15px}
input[type=password],input[type=text]{width:100%;padding:10px;border:1px solid #d9c487;border-radius:8px;font-size:16px}
button,.dl{background:#f3e4b0;border:1px solid #c9a54e;color:#6b5320;padding:10px 22px;border-radius:30px;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;margin:8px 8px 0 0}
button:disabled{opacity:.4}
.warn{color:#a2492f;font-size:14px;margin-top:6px}.ok{color:#3c7a3c}
#log{font-size:14px;margin-top:10px;white-space:pre-line}
</style></head><body>
<h1>Szyfrowanie zdjęć do albumu</h1>
<p>Narzędzie działa wyłącznie w Twojej przeglądarce: zdjęcia i hasło <b>nie są nigdzie wysyłane</b>. Możesz je uruchomić z pliku na dysku.</p>
<div class="card">
  <label for="f">1. Wybierz zdjęcia (JPG, PNG, WEBP):</label>
  <input type="file" id="f" accept="image/*" multiple>
  <div id="info" class="warn"></div>
  <label for="mode">2. Rozmiar zdjęć:</label>
  <select id="mode" style="width:100%;padding:10px;border:1px solid #d9c487;border-radius:8px;font-size:16px">
    <option value="resize">Zmniejsz do 3000 px, jakość 90% (zalecane, ok. 1–3 MB/zdjęcie)</option>
    <option value="both">Podgląd 1800 px + oryginał do pobrania (bardzo duże pliki)</option>
    <option value="orig">Tylko oryginały (nie polecane: wolne ładowanie)</option>
  </select>
  <div class="warn" style="color:#8a7a50">GitHub w przeglądarce nie przyjmie plików większych niż 25 MB, a cała strona nie powinna przekraczać ok. 1 GB.</div>
  <label for="pw">3. Hasło do albumu (dla gości):</label>
  <input type="text" id="pw" placeholder="np. trzy-cztery słowa i liczba" autocomplete="off">
  <div id="strength" class="warn"></div>
  <button id="go">4. Zaszyfruj</button>
  <div id="log"></div><div id="out"></div>
</div>
<script>
/*CORE*/
const ITER=250000;
const cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
async function deriveKey(pw,salt,use){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,use)}
async function encBytes(key,buf){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf));return cat(iv,ct)}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=~0;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return ~c>>>0}
function zip(files){
  const en=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){const n=en.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,sz,true);h.setUint32(22,sz,true);h.setUint16(26,n.length,true);
    parts.push(h,n,f.data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,sz,true);c.setUint32(24,sz,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);
    cen.push(c,n);off+=30+n.length+sz}
  let cs=0;cen.forEach(x=>cs+=x.byteLength);
  const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/zip'})}
async function encryptAll(pw,files,prep,progress,maxFiles=90,maxBytes=120e6){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await deriveKey(pw,salt,['encrypt']);
  const groups=[],manifest=[];let cur=[],size=0;
  const flush=()=>{if(cur.length){groups.push(cur);cur=[];size=0}};
  const add=(name,data)=>{if(cur.length>=maxFiles||size+data.length>maxBytes)flush();cur.push({name,data});size+=data.length};
  for(let i=0;i<files.length;i++){
    const r=await prep(files[i]);
    const id=String(i+1).padStart(4,'0')+'.enc';
    add('zdjecia/'+id,await encBytes(key,r.view));
    const m={enc:id,name:r.name,type:r.vtype};
    if(r.orig){const oid='o'+id;add('zdjecia/'+oid,await encBytes(key,r.orig));m.orig=oid;m.otype=r.otype}
    manifest.push(m);progress&&progress(i+1,files.length)}
  flush();
  groups[0].push({name:'album.enc',data:cat(salt,await encBytes(key,new TextEncoder().encode(JSON.stringify({files:manifest}))))});
  return groups.map(g=>zip(g))}
/*END*/

const $=id=>document.getElementById(id);
$('f').onchange=()=>{const bad=[...$('f').files].filter(f=>!/^image\/(jpeg|png|webp|gif)$/.test(f.type));
  $('info').textContent=`Wybrano: ${$('f').files.length}`+(bad.length?` – uwaga: ${bad.length} plik(ów) w formacie, którego przeglądarka może nie wyświetlić (np. HEIC). Zamień je na JPG.`:'')};
$('pw').oninput=()=>{const l=$('pw').value.length;$('strength').textContent=l&&l<12?'Za krótkie. Użyj min. 12 znaków (np. kilka słów), bo hasło chroni zdjęcia przed łamaniem.':''};
async function resizeJpg(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);if(bmp.close)bmp.close();
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));return new Uint8Array(await blob.arrayBuffer())}
const prepFor=mode=>async f=>{
  try{
    const base=f.name.replace(/\.[^.]+$/,'');
    if(mode==='resize')return{view:await resizeJpg(f,3000,.9),vtype:'image/jpeg',name:base+'.jpg'};
    if(mode==='both')return{view:await resizeJpg(f,1800,.82),vtype:'image/jpeg',orig:new Uint8Array(await f.arrayBuffer()),otype:f.type||'image/jpeg',name:f.name};
    return{view:new Uint8Array(await f.arrayBuffer()),vtype:f.type||'image/jpeg',name:f.name};
  }catch(e){throw new Error(`nie da się wczytać „${f.name}” (format nieobsługiwany? zamień na JPG)`)}};
$('go').onclick=async()=>{
  if(!window.crypto||!crypto.subtle){alert('Przeglądarka nie obsługuje szyfrowania. Otwórz plik w Chrome/Edge/Safari.');return}
  const fs=[...$('f').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  const pw=$('pw').value;
  if(!fs.length||!pw){alert('Wybierz zdjęcia i wpisz hasło.');return}
  if(pw.length<12&&!confirm('Hasło jest krótkie i łatwiejsze do złamania. Kontynuować mimo to?'))return;
  $('go').disabled=true;$('out').innerHTML='';
  try{
    const zips=await encryptAll(pw,fs,prepFor($('mode').value),(a,b)=>$('log').textContent=`Przetwarzam ${a} / ${b}…`);
    $('log').innerHTML='<span class="ok">Gotowe!</span> Pobierz wszystkie paczki, rozpakuj je do jednego folderu i wgraj na GitHub (każdy plik musi mieć mniej niż 25 MB).';
    zips.forEach((z,i)=>{const a=document.createElement('a');a.className='dl';a.href=URL.createObjectURL(z);a.download=`album-czesc-${i+1}.zip`;a.textContent=`↓ Paczka ${i+1} z ${zips.length}`;$('out').appendChild(a)});
  }catch(e){$('log').innerHTML='<span class="warn">Błąd: '+e.message+'</span>'}
  $('go').disabled=false};
</script></body></html>
